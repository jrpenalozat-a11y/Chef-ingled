name: Compilar Control Aire (APK)

on:
  push:
    paths:
      - 'control-aire/**'
      - '.github/workflows/control-aire.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK
        working-directory: control-aire
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk control-aire.apk
      - uses: actions/upload-artifact@v4
        with:
          name: control-aire-apk
          path: control-aire/control-aire.apk
