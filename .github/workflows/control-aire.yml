name: Compilar Control Aire (APK)

on:
  push:
    paths:
      - 'control-aire/**'
      - '.github/workflows/control-aire.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK
        working-directory: control-aire
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk control-aire.apk
      - uses: actions/upload-artifact@v4
        with:
          name: control-aire-apk
          path: control-aire/control-aire.apk
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view control-aire >/dev/null 2>&1; then
            gh release upload control-aire control-aire/control-aire.apk --clobber
          else
            gh release create control-aire control-aire/control-aire.apk \
              --target "$GITHUB_SHA" \
              --title "Control Aire" \
              --notes "Control remoto infrarrojo para aire acondicionado. Descarga control-aire.apk e instálalo en un teléfono Android con emisor infrarrojo."
          fi
